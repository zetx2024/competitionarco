<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel to JSON Generator</title>
 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
  <style type="text/css"> 
/* Basic reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background-color: #f9f9f9;
}

h1, h2 {
  text-align: center;
  margin-bottom: 20px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  background-color: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background-color: #45a049;
}

pre {
  background-color: #f4f4f4;
  padding: 10px;
  border: 1px solid #ddd;
  white-space: pre-wrap;
  word-wrap: break-word;
}
  </style>
</head>
<body>
  <h1>Excel to JSON Generator</h1>

  <p>Upload your Excel file below:</p>

  <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" />
  
  <button id="generate-json-btn" style="display: none;">Generate JSON</button>
  <button id="show-json-btn" style="display: none;">Show JSON</button>
  <button id="copy-json-btn" style="display: none;">Copy to Clipboard</button>

  <h2>Generated JSON Output:</h2>
  <pre id="json-output" style="display: none;"></pre>

  <script>
// Function to generate random ID in the format azAZ0-9
function generateRandomID() {
  const characters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let result = '';
  const length = 8;
  for (let i = 0; i < length; i++) {
    result += characters.charAt(Math.floor(Math.random() * characters.length));
  }
  return result;
}

// Function to read the uploaded Excel file
document.getElementById('excel-file').addEventListener('change', function(event) {
  const file = event.target.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    const data = e.target.result;
    const workbook = XLSX.read(data, { type: 'array' });

    // Get the first sheet name and parse the data
    const sheet = workbook.Sheets[workbook.SheetNames[0]]; // Getting the first sheet
    const sheetData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    // Process the sheet data (skip the header row)
    const studentData = [];
    for (let i = 1; i < sheetData.length; i++) {
      const row = sheetData[i];

      // Extract values from Excel columns with fallbacks for missing values
      const studentName = row[0] ? row[0].toString().trim() : ''; 
      const schoolName  = row[1] ? row[1].toString().trim() : ''; 
      const category    = row[2] ? row[2].toString().trim() : ''; 
      const country     = row[3] ? row[3].toString().trim() : ''; 
      const selected    = row[4] ? row[4].toString().trim() : ''; 

      // Process only rows that have a student name
      if (studentName) {
        const student = {
          id: generateRandomID(),  // Randomly generated ID
          category: category,      // From Excel (Column C)
          name: studentName,       // From Excel (Column A)
          school: schoolName,      // From Excel (Column B)
          country: country,        // From Excel (Column D)
          selected: selected       // From Excel (Column E)
        };
        studentData.push(student);
      }
    }

    // Generate the JSON output and display it
    const jsonOutput = document.getElementById('json-output');
    jsonOutput.textContent = JSON.stringify(studentData, null, 2);
    jsonOutput.style.display = 'block';

    // Show action buttons
    document.getElementById('generate-json-btn').style.display = 'inline-block';
    document.getElementById('show-json-btn').style.display = 'inline-block';
    document.getElementById('copy-json-btn').style.display = 'inline-block';
  };

  reader.readAsArrayBuffer(file);
});

// Toggle visibility of the JSON output when "Show JSON" is clicked
document.getElementById('show-json-btn').addEventListener('click', function() {
  const jsonOutput = document.getElementById('json-output');
  const isVisible = jsonOutput.style.display === 'block';
  jsonOutput.style.display = isVisible ? 'none' : 'block';
});

// Copy the JSON to clipboard using modern Clipboard API with legacy fallback
document.getElementById('copy-json-btn').addEventListener('click', function() {
  const jsonOutput = document.getElementById('json-output');
  const textToCopy = jsonOutput.textContent;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textToCopy).then(() => {
      alert('JSON copied to clipboard!');
    }).catch(err => {
      alert('Failed to copy: ' + err);
    });
  } else {
    // Fallback for older browsers
    const tempTextArea = document.createElement('textarea');
    tempTextArea.value = textToCopy;
    document.body.appendChild(tempTextArea);
    tempTextArea.select();
    document.execCommand('copy');
    document.body.removeChild(tempTextArea);
    alert('JSON copied to clipboard!');
  }
});
  </script>
</body>
</html>
